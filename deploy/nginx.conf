# ============================================================================
# CageErpApi — Nginx reverse proxy (api.cageouts.com.br)
# ============================================================================
# Destino na VPS: /etc/nginx/sites-available/cage-erp-api
# Habilitar:    sudo ln -sf /etc/nginx/sites-available/cage-erp-api /etc/nginx/sites-enabled/cage-erp-api
# Validar:      sudo nginx -t
# Recarregar:   sudo systemctl reload nginx
# HTTPS:        sudo certbot --nginx -d api.cageouts.com.br --email devhsieh.marcos@gmail.com --agree-tos --redirect --no-eff-email
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.cageouts.com.br;

    client_max_body_size 50M;

    access_log /var/log/nginx/cage-erp-api.access.log;
    error_log  /var/log/nginx/cage-erp-api.error.log warn;

    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
